<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: var(--vscode-font-family);
        padding: 10px;
        color: var(--vscode-editor-foreground);
        background: var(--vscode-editor-background);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
      }

      /* 视图容器 */
      .view-section {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      .view-section.active {
        display: flex;
      }

      /* 表单与控件样式 */
      .control-group {
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      label {
        display: block;
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
        margin-bottom: 3px;
      }
      select,
      input[type='text'],
      input[type='password'],
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        background: var(--vscode-input-background);
        color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border);
        padding: 6px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 12px;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: 1px solid var(--vscode-focusBorder);
      }
      textarea {
        resize: vertical;
        height: 70px;
        margin-top: 2px;
      }

      button.primary-btn {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-top: 5px;
      }
      button.primary-btn:hover:not(:disabled) {
        background: var(--vscode-button-hoverBackground);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }
      .btn-refresh {
        width: auto;
        padding: 6px 10px;
        white-space: nowrap;
        margin-top: 0;
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      .btn-refresh:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }

      .history-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
      }
      .select-all-label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
        margin-bottom: 0 !important;
      }

      /* Settings 标题与切换控制 */
      .settings-header {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 10px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--vscode-panel-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Loading 样式 */
      #loadingIndicator {
        display: none;
        align-items: center;
        gap: 8px;
        color: var(--vscode-descriptionForeground);
        font-size: 12px;
        margin: 8px 0;
      }
      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--vscode-progressBar-background);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #chat-container {
        flex: 1;
        overflow-y: auto;
        border: 1px solid var(--vscode-panel-border);
        padding: 8px;
        margin-top: 5px;
        border-radius: 4px;
        background: var(--vscode-textCodeBlock-background);
        font-size: 13px;
        line-height: 1.4;
      }

      .chat-item-wrapper {
        margin-bottom: 12px;
        border-bottom: 1px dashed var(--vscode-panel-border);
        padding-bottom: 8px;
      }
      .chat-header-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      .user-msg {
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--vscode-textLink-activeForeground);
        font-weight: bold;
      }
      .response-box {
        border: 1px solid var(--vscode-panel-border);
        border-radius: 4px;
        background: var(--vscode-editor-background);
        overflow: hidden;
        transition: background-color 0.3s;
      }
      .response-box.completed {
        background-color: rgba(46, 160, 67, 0.12) !important;
        border-color: rgba(46, 160, 67, 0.4);
      }

      .response-summary {
        color: var(--vscode-editor-foreground);
        font-weight: bold;
        padding: 6px 8px;
        cursor: pointer;
        list-style: none;
        background: var(--vscode-sideBar-background);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .response-summary::-webkit-details-marker {
        display: none;
      }
      .response-summary::before {
        content: '▶';
        font-size: 10px;
        transition: transform 0.2s;
      }
      details.response-box[open] > .response-summary::before {
        transform: rotate(90deg);
      }
      .response-content {
        padding: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        border-top: 1px solid var(--vscode-panel-border);
      }

      .task-done-badge {
        margin-top: 6px;
        padding: 4px 8px;
        background: rgba(46, 160, 67, 0.2);
        color: var(--vscode-testing-iconPassed, #4caf50);
        font-weight: bold;
        font-size: 12px;
        border-radius: 3px;
        display: inline-block;
      }

      .thinking {
        color: var(--vscode-descriptionForeground);
        border-left: 2px solid var(--vscode-textBlockQuote-border);
        padding-left: 6px;
        margin: 4px 0;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <!-- 1. 聊天主界面 -->
    <div id="chatView" class="view-section active">
      <div class="control-group">
        <label for="modelSelect">选择模型:</label>
        <div class="row">
          <select id="modelSelect">
            <option>正在获取模型列表...</option>
          </select>
          <button id="refreshBtn" class="btn-refresh" title="刷新模型列表">🔄</button>
        </div>
      </div>
      <div class="control-group">
        <textarea
          id="promptInput"
          placeholder="输入你想编写的代码或问题... (Ctrl+Enter 发送)"
        ></textarea>
        <button id="sendBtn" class="primary-btn">发送</button>
      </div>

      <div class="history-toolbar">
        <label class="select-all-label">
          <input type="checkbox" id="selectAllCheckbox" /> 全选
        </label>
        <button id="deleteSelectedBtn" class="btn-refresh" style="padding: 2px 6px">
          删除选中项
        </button>
      </div>

      <div id="loadingIndicator">
        <div class="spinner"></div>
        <span>正在等待模型回应与执行任务...</span>
      </div>

      <div id="chat-container">
        <div id="responseArea"></div>
      </div>
    </div>

    <!-- 2. 设置界面 -->
    <div id="settingsView" class="view-section">
      <div class="settings-header">
        <span>本地 / 内网 AI 服务配置</span>
        <button id="closeSettingsBtn" class="btn-refresh" style="padding: 2px 6px">
          关闭配置页
        </button>
      </div>

      <div class="control-group">
        <label>服务协议 (Protocol)</label>
        <select id="protocolSelect">
          <option value="ollama">Ollama 协议原生</option>
          <option value="openai">OpenAI 兼容协议 (LM Studio, vLLM, llama.cpp 等)</option>
        </select>
      </div>

      <div class="control-group">
        <label>服务地址(Base URL)</label>
        <input
          type="text"
          id="baseUrlInput"
          placeholder="例如: http://127.0.0.1:11434 或 http://127.0.0.1:1234/v1"
        />
      </div>

      <div class="control-group" id="apiKeyContainer">
        <label>密钥(API Key,内网需要鉴权时填写)</label>
        <input
          type="password"
          id="apiKeyInput"
          placeholder="若服务器设置了 Bearer Token 请在此填写"
        />
      </div>

      <div class="control-group">
        <label>上下文大小(Context Size)</label>
        <select id="numCtxSelect">
          <option value="8k">8K</option>
          <option value="16k">16K</option>
          <option value="32k" selected>32K</option>
          <option value="64k">64K</option>
          <option value="128k">128K</option>
          <option value="256k">256K</option>
        </select>
      </div>

      <button id="saveSettingsBtn" class="primary-btn">保存配置</button>
    </div>

    <script>
      const vscode = acquireVsCodeApi();

      const chatView = document.getElementById('chatView');
      const settingsView = document.getElementById('settingsView');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');

      const protocolSelect = document.getElementById('protocolSelect');
      const baseUrlInput = document.getElementById('baseUrlInput');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const numCtxSelect = document.getElementById('numCtxSelect');
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');

      const modelSelect = document.getElementById('modelSelect');
      const refreshBtn = document.getElementById('refreshBtn');
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const responseArea = document.getElementById('responseArea');
      const loadingIndicator = document.getElementById('loadingIndicator');
      const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');

      let isSettingsOpen = false;

      function toggleSettings(open) {
        isSettingsOpen = typeof open === 'boolean' ? open : !isSettingsOpen;
        if (isSettingsOpen) {
          chatView.classList.remove('active');
          settingsView.classList.add('active');
          vscode.postMessage({type: 'getSettings'});
        } else {
          settingsView.classList.remove('active');
          chatView.classList.add('active');
          vscode.postMessage({type: 'getModels'});
        }
      }

      closeSettingsBtn.addEventListener('click', () => toggleSettings(false));

      protocolSelect.addEventListener('change', () => {
        if (protocolSelect.value === 'ollama') {
          if (!baseUrlInput.value || baseUrlInput.value.includes('1234')) {
            baseUrlInput.value = 'http://127.0.0.1:11434';
          }
        } else {
          if (!baseUrlInput.value || baseUrlInput.value.includes('11434')) {
            baseUrlInput.value = 'http://127.0.0.1:1234/v1';
          }
        }
      });

      window.addEventListener('load', () => {
        vscode.postMessage({type: 'getSettings'});
        vscode.postMessage({type: 'getModels'});
        vscode.postMessage({type: 'getHistory'});
      });

      refreshBtn.addEventListener('click', () => {
        modelSelect.innerHTML = '<option>正在获取模型列表...</option>';
        vscode.postMessage({type: 'getModels'});
      });

      saveSettingsBtn.addEventListener('click', () => {
        const settings = {
          protocol: protocolSelect.value,
          baseUrl: baseUrlInput.value.trim(),
          apiKey: apiKeyInput.value.trim(),
          numCtx: numCtxSelect.value,
        };
        vscode.postMessage({type: 'saveSettings', settings});
      });

      sendBtn.addEventListener('click', sendMessage);
      promptInput.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') {
          if (!sendBtn.disabled) sendMessage();
        }
      });

      // 全选/全取消逻辑
      selectAllCheckbox.addEventListener('change', () => {
        const checkboxes = document.querySelectorAll('.history-checkbox');
        checkboxes.forEach(cb => {
          cb.checked = selectAllCheckbox.checked;
        });
      });

      deleteSelectedBtn.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.history-checkbox:checked');
        const ids = Array.from(checkboxes).map(cb => parseInt(cb.dataset.id));
        if (ids.length === 0) return;
        vscode.postMessage({type: 'deleteHistory', ids});
      });

      function sendMessage() {
        const prompt = promptInput.value.trim();
        const model = modelSelect.value;
        if (!prompt || !model) return;

        sendBtn.disabled = true;
        promptInput.value = '';
        loadingIndicator.style.display = 'flex';

        vscode.postMessage({type: 'sendMessage', prompt, model});
      }

      window.addEventListener('message', event => {
        const message = event.data;
        switch (message.type) {
          case 'toggleSettingsView':
            toggleSettings();
            break;
          case 'loadSettings':
            const s = message.settings;
            protocolSelect.value = s.protocol || 'ollama';
            baseUrlInput.value = s.baseUrl || 'http://127.0.0.1:11434';
            apiKeyInput.value = s.apiKey || '';
            numCtxSelect.value = s.numCtx || '32k';
            break;
          case 'settingsSaved':
            toggleSettings(false);
            break;
          case 'modelList':
            modelSelect.innerHTML = '';
            if (!message.models || message.models.length === 0) {
              modelSelect.innerHTML = '<option>未检测到可用模型</option>';
              return;
            }
            message.models.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m;
              opt.textContent = m;
              if (message.selectedModel && m === message.selectedModel) {
                opt.selected = true;
              }
              modelSelect.appendChild(opt);
            });
            break;
          case 'renderHistory':
            renderHistoryList(message.history);
            break;
          case 'streamChunk':
            loadingIndicator.style.display = 'none';
            const curr = document.getElementById('current-response');
            if (curr) {
              curr.textContent += message.chunk;
              let html = curr.textContent;
              html = html.split('<think>').join('<div class="thinking">思考中...<br>');
              html = html.split('</think>').join('</div><hr>');
              curr.innerHTML = html;

              const container = document.getElementById('chat-container');
              container.scrollTop = container.scrollHeight;
            }
            break;
          case 'streamEnd':
            loadingIndicator.style.display = 'none';
            sendBtn.disabled = false;
            const box = document.getElementById('current-response-box');
            if (box) {
              box.classList.add('completed');
            }
            const currEnd = document.getElementById('current-response');
            if (currEnd) {
              const badge = document.createElement('div');
              badge.className = 'task-done-badge';
              badge.textContent = '✅ 任务完成';
              currEnd.appendChild(badge);
              currEnd.removeAttribute('id');
            }
            if (box) {
              box.removeAttribute('id');
            }
            break;
        }
      });

      function renderHistoryList(history) {
        responseArea.innerHTML = '';
        // 每次重新渲染时重置全选框状态
        if (selectAllCheckbox) selectAllCheckbox.checked = false;

        history.forEach(item => {
          const wrapper = document.createElement('div');
          wrapper.className = 'chat-item-wrapper';

          const headerRow = document.createElement('div');
          headerRow.className = 'chat-header-row';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'history-checkbox';
          checkbox.dataset.id = item.id;

          // 为单项复选框绑定点击联动，如果手动取消其中一个，可以使体验更完善
          checkbox.addEventListener('change', () => {
            const allCheckboxes = document.querySelectorAll('.history-checkbox');
            const checkedCheckboxes = document.querySelectorAll('.history-checkbox:checked');
            selectAllCheckbox.checked =
              allCheckboxes.length > 0 && allCheckboxes.length === checkedCheckboxes.length;
          });

          const userMsg = document.createElement('div');
          userMsg.className = 'user-msg';
          userMsg.textContent = '用户: ' + item.prompt;

          headerRow.appendChild(checkbox);
          headerRow.appendChild(userMsg);
          wrapper.appendChild(headerRow);

          const details = document.createElement('details');
          details.className = 'response-box' + (item.completed ? ' completed' : '');
          if (!item.completed) details.open = true;

          const summary = document.createElement('summary');
          summary.className = 'response-summary';
          summary.textContent = '模型回复 (' + item.model + ')';
          details.appendChild(summary);

          const contentDiv = document.createElement('div');
          contentDiv.className = 'response-content';

          let html = item.response || '';
          html = html.split('<think>').join('<div class="thinking">思考中...<br>');
          html = html.split('</think>').join('</div><hr>');
          contentDiv.innerHTML = html;

          if (item.completed) {
            const badge = document.createElement('div');
            badge.className = 'task-done-badge';
            badge.textContent = '✅ 任务完成';
            contentDiv.appendChild(badge);
          } else {
            contentDiv.id = 'current-response';
            details.id = 'current-response-box';
          }

          details.appendChild(contentDiv);
          wrapper.appendChild(details);
          responseArea.appendChild(wrapper);
        });

        const container = document.getElementById('chat-container');
        container.scrollTop = container.scrollHeight;
      }
    </script>
  </body>
</html>
