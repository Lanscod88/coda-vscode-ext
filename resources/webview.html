<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: var(--vscode-font-family);
        padding: 10px;
        color: var(--vscode-editor-foreground);
        background: var(--vscode-editor-background);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
      }

      .view-section {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      .view-section.active {
        display: flex;
      }

      .control-group {
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      label {
        display: block;
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
        margin-bottom: 3px;
      }
      select,
      input[type='text'],
      input[type='password'],
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        background: var(--vscode-input-background);
        color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border);
        padding: 6px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 12px;
      }
      select:disabled,
      input:disabled,
      textarea:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: 1px solid var(--vscode-focusBorder);
      }
      textarea {
        resize: vertical;
        height: 60px;
        margin-top: 2px;
      }

      button.primary-btn {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-top: 5px;
      }
      button.primary-btn:hover:not(:disabled) {
        background: var(--vscode-button-hoverBackground);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }
      .btn-refresh {
        width: auto;
        padding: 6px 10px;
        white-space: nowrap;
        margin-top: 0;
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      .btn-refresh:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }

      .top-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--vscode-panel-border);
      }
      .toolbar-icons {
        display: flex;
        gap: 6px;
      }
      .icon-btn {
        background: none;
        border: none;
        color: var(--vscode-foreground);
        cursor: pointer;
        font-size: 14px;
        padding: 2px 6px;
        border-radius: 3px;
      }
      .icon-btn:hover {
        background: var(--vscode-toolbar-hoverBackground);
      }

      .customize-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .tab-btn {
        flex: 1;
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
        border: none;
        padding: 4px;
        cursor: pointer;
        border-radius: 3px;
        font-weight: bold;
      }
      .tab-btn.active {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      .collab-panel {
        border: 1px solid var(--vscode-panel-border);
        padding: 6px;
        border-radius: 4px;
        background: var(--vscode-editorWidget-background);
        margin-bottom: 8px;
      }
      .collab-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .collab-sub {
        display: none;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px dashed var(--vscode-panel-border);
      }
      .collab-sub.active {
        display: block;
      }

      .skill-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--vscode-input-background);
        padding: 4px 8px;
        border-radius: 3px;
        margin-bottom: 4px;
        font-size: 12px;
      }

      .action-buttons {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .action-buttons button {
        padding: 4px 10px;
        font-size: 11px;
        cursor: pointer;
        border-radius: 3px;
        border: none;
        font-weight: bold;
      }
      .btn-accept {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }
      .btn-skip {
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }

      .history-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
      }
      .select-all-label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
        margin-bottom: 0 !important;
      }

      .settings-header {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 10px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--vscode-panel-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #loadingIndicator {
        display: none;
        align-items: center;
        gap: 8px;
        color: var(--vscode-descriptionForeground);
        font-size: 12px;
        margin: 8px 0;
      }
      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--vscode-progressBar-background);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #chat-container {
        flex: 1;
        overflow-y: auto;
        border: 1px solid var(--vscode-panel-border);
        padding: 8px;
        margin-top: 5px;
        border-radius: 4px;
        background: var(--vscode-textCodeBlock-background);
        font-size: 13px;
        line-height: 1.4;
      }

      .chat-item-wrapper {
        margin-bottom: 12px;
        border-bottom: 1px dashed var(--vscode-panel-border);
        padding-bottom: 8px;
      }
      .chat-header-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      .user-msg {
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--vscode-textLink-activeForeground);
        font-weight: bold;
      }
      .response-box {
        border: 1px solid var(--vscode-panel-border);
        border-radius: 4px;
        background: var(--vscode-editor-background);
        overflow: hidden;
        transition: background-color 0.3s;
      }
      .response-box.completed {
        background-color: rgba(46, 160, 67, 0.12) !important;
        border-color: rgba(46, 160, 67, 0.4);
      }

      .response-summary {
        color: var(--vscode-editor-foreground);
        font-weight: bold;
        padding: 6px 8px;
        cursor: pointer;
        list-style: none;
        background: var(--vscode-sideBar-background);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .response-summary::-webkit-details-marker {
        display: none;
      }
      .response-summary::before {
        content: '▶';
        font-size: 10px;
        transition: transform 0.2s;
      }
      details.response-box[open] > .response-summary::before {
        transform: rotate(90deg);
      }
      .response-content {
        padding: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        border-top: 1px solid var(--vscode-panel-border);
      }

      .task-done-badge {
        margin-top: 6px;
        padding: 4px 8px;
        background: rgba(46, 160, 67, 0.2);
        color: var(--vscode-testing-iconPassed, #4caf50);
        font-weight: bold;
        font-size: 12px;
        border-radius: 3px;
        display: inline-block;
      }

      .thinking {
        color: var(--vscode-descriptionForeground);
        border-left: 2px solid var(--vscode-textBlockQuote-border);
        padding-left: 6px;
        margin: 4px 0;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <!-- 1. 聊天主界面 -->
    <div id="chatView" class="view-section active">
      <div class="top-toolbar">
        <span style="font-weight: bold; font-size: 12px">本地 AI 编程助手</span>
        <div class="toolbar-icons">
          <button id="openCustomizeBtn" class="icon-btn" title="Customize (Skills & MCP)">
            🛠️
          </button>
          <button id="openSettingsBtn" class="icon-btn" title="Settings">⚙️</button>
        </div>
      </div>

      <div class="control-group">
        <label for="modelSelect">选择模型:</label>
        <div class="row">
          <select id="modelSelect">
            <option>正在获取模型列表...</option>
          </select>
          <button id="refreshBtn" class="btn-refresh" title="刷新模型列表">🔄</button>
        </div>
      </div>

      <!-- 多模型协作配置面板 -->
      <div class="collab-panel">
        <label class="collab-row">
          <input type="checkbox" id="collabCheckbox" /> 启用多模型协作 (架构规划 + 代码实现)
        </label>
        <div id="collabSubPanel" class="collab-sub">
          <div class="control-group" style="margin-bottom: 4px">
            <label>1. 架构设计模型:</label>
            <select id="designModelSelect" disabled>
              <option>加载中...</option>
            </select>
          </div>
          <div class="control-group" style="margin-bottom: 0">
            <label>2. 代码实现模型:</label>
            <select id="implModelSelect" disabled>
              <option>加载中...</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 激活的 Skills 选择 -->
      <div class="control-group" style="margin-bottom: 6px">
        <label for="activeSkillSelect">挂载自定义 Skill (可选):</label>
        <select id="activeSkillSelect">
          <option value="">-- 不使用 Skill --</option>
        </select>
      </div>

      <div class="control-group">
        <textarea
          id="promptInput"
          placeholder="输入需求、提问或代码审查指令... (Ctrl+Enter 发送)"
        ></textarea>
        <button id="sendBtn" class="primary-btn">发送</button>
      </div>

      <div class="history-toolbar">
        <label class="select-all-label">
          <input type="checkbox" id="selectAllCheckbox" /> 全选
        </label>
        <button id="deleteSelectedBtn" class="btn-refresh" style="padding: 2px 6px">
          删除选中项
        </button>
      </div>

      <div id="loadingIndicator">
        <div class="spinner"></div>
        <span>正在等待模型回应与执行任务...</span>
      </div>

      <div id="chat-container">
        <div id="responseArea"></div>
      </div>
    </div>

    <!-- 2. Customize 界面 (Skills & MCP) -->
    <div id="customizeView" class="view-section">
      <div class="settings-header">
        <span>Customize (Skills & MCP)</span>
        <button id="closeCustomizeBtn" class="btn-refresh" style="padding: 2px 6px">
          返回聊天
        </button>
      </div>

      <div class="customize-tabs">
        <button class="tab-btn active" data-tab="skillsTab">Skills</button>
        <button class="tab-btn" data-tab="mcpTab">MCP 接口</button>
      </div>

      <!-- Skills Tab -->
      <div id="skillsTab" class="tab-content active">
        <div class="control-group">
          <label>新建自定义 Skill</label>
          <input
            type="text"
            id="newSkillName"
            placeholder="Skill 名称 (例如: react-best-practices)"
            style="margin-bottom: 4px"
          />
          <textarea
            id="newSkillContent"
            placeholder="输入该 Skill 的具体规则、指令或模板内容..."
            style="height: 60px"
          ></textarea>
          <button id="saveSkillBtn" class="primary-btn">保存新 Skill</button>
        </div>
        <div class="control-group" style="margin-top: 10px">
          <label>已安装的 Skills:</label>
          <div id="skillsListContainer" style="max-height: 180px; overflow-y: auto"></div>
        </div>
      </div>

      <!-- MCP Tab -->
      <div id="mcpTab" class="tab-content">
        <div class="control-group">
          <label>MCP 服务器与工具注册状态</label>
          <p style="font-size: 11px; color: var(--vscode-descriptionForeground); margin: 4px 0">
            通过 MCP 协议，AI 助手已自动挂载以下本地工作区管理工具：
          </p>
          <div class="skill-item">
            <span>📁 list_directory (目录浏览)</span><span style="color: #4caf50">已激活</span>
          </div>
          <div class="skill-item">
            <span>📖 read_file (文件读取)</span><span style="color: #4caf50">已激活</span>
          </div>
          <div class="skill-item">
            <span>✍️ write_file (文件写入/创建)</span><span style="color: #4caf50">已激活</span>
          </div>
          <div class="skill-item">
            <span>🗑️ delete_file (文件删除)</span><span style="color: #4caf50">已激活</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 设置界面 -->
    <div id="settingsView" class="view-section">
      <div class="settings-header">
        <span>本地 / 内网 AI 服务配置</span>
        <button id="closeSettingsBtn" class="btn-refresh" style="padding: 2px 6px">返回聊天</button>
      </div>

      <div class="control-group">
        <label>服务协议 (Protocol)</label>
        <select id="protocolSelect">
          <option value="ollama">Ollama 协议原生</option>
          <option value="openai">OpenAI 兼容协议 (LM Studio, vLLM 等)</option>
        </select>
      </div>

      <div class="control-group">
        <label>服务地址(Base URL)</label>
        <input type="text" id="baseUrlInput" placeholder="例如: http://127.0.0.1:11434" />
      </div>

      <div class="control-group">
        <label>密钥(API Key)</label>
        <input type="password" id="apiKeyInput" placeholder="若服务器需鉴权请填写" />
      </div>

      <div class="control-group">
        <label>上下文大小(Context Size)</label>
        <select id="numCtxSelect">
          <option value="8k">8K</option>
          <option value="16k">16K</option>
          <option value="32k" selected>32K</option>
          <option value="64k">64K</option>
          <option value="128k">128K</option>
        </select>
      </div>

      <button id="saveSettingsBtn" class="primary-btn">保存配置</button>
    </div>

    <script>
      const vscode = acquireVsCodeApi();

      const chatView = document.getElementById('chatView');
      const customizeView = document.getElementById('customizeView');
      const settingsView = document.getElementById('settingsView');

      const openCustomizeBtn = document.getElementById('openCustomizeBtn');
      const closeCustomizeBtn = document.getElementById('closeCustomizeBtn');
      const openSettingsBtn = document.getElementById('openSettingsBtn');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');

      const protocolSelect = document.getElementById('protocolSelect');
      const baseUrlInput = document.getElementById('baseUrlInput');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const numCtxSelect = document.getElementById('numCtxSelect');
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');

      const modelSelect = document.getElementById('modelSelect');
      const refreshBtn = document.getElementById('refreshBtn');
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const responseArea = document.getElementById('responseArea');
      const loadingIndicator = document.getElementById('loadingIndicator');
      const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');

      const collabCheckbox = document.getElementById('collabCheckbox');
      const collabSubPanel = document.getElementById('collabSubPanel');
      const designModelSelect = document.getElementById('designModelSelect');
      const implModelSelect = document.getElementById('implModelSelect');
      const activeSkillSelect = document.getElementById('activeSkillSelect');

      const saveSkillBtn = document.getElementById('saveSkillBtn');
      const newSkillName = document.getElementById('newSkillName');
      const newSkillContent = document.getElementById('newSkillContent');
      const skillsListContainer = document.getElementById('skillsListContainer');

      function switchView(viewName) {
        chatView.classList.remove('active');
        customizeView.classList.remove('active');
        settingsView.classList.remove('active');

        if (viewName === 'chat') {
          chatView.classList.add('active');
          vscode.postMessage({type: 'getModels'});
        } else if (viewName === 'customize') {
          customizeView.classList.add('active');
          vscode.postMessage({type: 'getSkills'});
        } else if (viewName === 'settings') {
          settingsView.classList.add('active');
          vscode.postMessage({type: 'getSettings'});
        }
      }

      openCustomizeBtn.addEventListener('click', () => switchView('customize'));
      closeCustomizeBtn.addEventListener('click', () => switchView('chat'));
      openSettingsBtn.addEventListener('click', () => switchView('settings'));
      closeSettingsBtn.addEventListener('click', () => switchView('chat'));

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).classList.add('active');
        });
      });

      collabCheckbox.addEventListener('change', () => {
        const active = collabCheckbox.checked;
        if (active) {
          collabSubPanel.classList.add('active');
          designModelSelect.disabled = false;
          implModelSelect.disabled = false;
          sendBtn.textContent = '🚀 开始协同开发';
        } else {
          collabSubPanel.classList.remove('active');
          designModelSelect.disabled = true;
          implModelSelect.disabled = true;
          sendBtn.textContent = '发送';
        }
      });

      window.addEventListener('load', () => {
        vscode.postMessage({type: 'getSettings'});
        vscode.postMessage({type: 'getModels'});
        vscode.postMessage({type: 'getHistory'});
        vscode.postMessage({type: 'getSkills'});
      });

      refreshBtn.addEventListener('click', () => {
        modelSelect.innerHTML = '<option>正在获取模型列表...</option>';
        vscode.postMessage({type: 'getModels'});
      });

      saveSettingsBtn.addEventListener('click', () => {
        const settings = {
          protocol: protocolSelect.value,
          baseUrl: baseUrlInput.value.trim(),
          apiKey: apiKeyInput.value.trim(),
          numCtx: numCtxSelect.value,
        };
        vscode.postMessage({type: 'saveSettings', settings});
      });

      saveSkillBtn.addEventListener('click', () => {
        const name = newSkillName.value.trim();
        const content = newSkillContent.value.trim();
        if (!name || !content) return;
        vscode.postMessage({type: 'saveSkill', skill: {name, content}});
        newSkillName.value = '';
        newSkillContent.value = '';
      });

      sendBtn.addEventListener('click', sendMessage);
      promptInput.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') {
          if (!sendBtn.disabled) sendMessage();
        }
      });

      selectAllCheckbox.addEventListener('change', () => {
        const checkboxes = document.querySelectorAll('.history-checkbox');
        checkboxes.forEach(cb => {
          cb.checked = selectAllCheckbox.checked;
        });
      });

      deleteSelectedBtn.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.history-checkbox:checked');
        const ids = Array.from(checkboxes).map(cb => parseInt(cb.dataset.id));
        if (ids.length === 0) return;
        vscode.postMessage({type: 'deleteHistory', ids});
      });

      function sendMessage() {
        const prompt = promptInput.value.trim();
        const model = modelSelect.value;
        const collabEnabled = collabCheckbox.checked;
        const collabConfig = {
          designModel: designModelSelect.value,
          implModel: implModelSelect.value,
        };
        const activeSkill = activeSkillSelect.value;

        if (!prompt || !model) return;

        sendBtn.disabled = true;
        promptInput.value = '';
        loadingIndicator.style.display = 'flex';

        vscode.postMessage({
          type: 'sendMessage',
          prompt,
          model,
          collabEnabled,
          collabConfig,
          activeSkill,
        });
      }

      window.addEventListener('message', event => {
        const message = event.data;
        switch (message.type) {
          case 'toggleSettingsView':
            switchView('settings');
            break;
          case 'loadSettings':
            const s = message.settings;
            protocolSelect.value = s.protocol || 'ollama';
            baseUrlInput.value = s.baseUrl || 'http://127.0.0.1:11434';
            apiKeyInput.value = s.apiKey || '';
            numCtxSelect.value = s.numCtx || '32k';
            break;
          case 'settingsSaved':
            switchView('chat');
            break;
          case 'modelList':
            populateModels(message.models, message.selectedModel);
            break;
          case 'renderSkills':
            renderSkillsList(message.skills);
            break;
          case 'renderHistory':
            renderHistoryList(message.history);
            break;
          case 'streamChunk':
            loadingIndicator.style.display = 'none';
            // 使用 .active-streaming 精准定位到最后一条正在流式输出的回复，避免插到中间
            const curr = document.querySelector('.active-streaming');
            if (curr) {
              curr.textContent += message.chunk;
              let html = curr.textContent;
              html = html.split('<think>').join('<div class="thinking">思考中...<br>');
              html = html.split('</think>').join('</div><hr>');
              curr.innerHTML = html;
              const container = document.getElementById('chat-container');
              container.scrollTop = container.scrollHeight;
            }
            break;
          case 'showReviewAction':
            loadingIndicator.style.display = 'none';
            // 找到最后一条未完成项，为其追加审查按钮
            const lastContentDiv = document.querySelector('.active-streaming');
            if (lastContentDiv) {
              showReviewButtons(
                message.historyId,
                message.reviewText,
                message.implModel,
                lastContentDiv,
              );
            }
            break;
          case 'streamEnd':
            loadingIndicator.style.display = 'none';
            sendBtn.disabled = false;
            const activeBox = document.querySelector('.response-box:not(.completed)');
            if (activeBox) activeBox.classList.add('completed');
            const activeContent = document.querySelector('.active-streaming');
            if (activeContent) {
              const badge = document.createElement('div');
              badge.className = 'task-done-badge';
              badge.textContent = '✅ 任务完成';
              activeContent.appendChild(badge);
              activeContent.classList.remove('active-streaming');
            }
            break;
        }
      });

      function populateModels(models, selectedModel) {
        const selects = [modelSelect, designModelSelect, implModelSelect];
        selects.forEach(select => {
          select.innerHTML = '';
          if (!models || models.length === 0) {
            select.innerHTML = '<option>未检测到可用模型</option>';
            return;
          }
          models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            if (select === modelSelect && selectedModel && m === selectedModel) opt.selected = true;
            if (select === designModelSelect && m.toLowerCase().includes('deepseek'))
              opt.selected = true;
            if (
              select === implModelSelect &&
              (m.toLowerCase().includes('coder') || m.toLowerCase().includes('qwen'))
            )
              opt.selected = true;
            select.appendChild(opt);
          });
          if (select.selectedIndex === -1 && models.length > 0) select.selectedIndex = 0;
        });
      }

      function showReviewButtons(historyId, reviewText, implModel, targetDiv) {
        if (!targetDiv) return;
        // 防止重复创建
        if (targetDiv.querySelector('.action-buttons')) return;

        const actionDiv = document.createElement('div');
        actionDiv.className = 'action-buttons';
        actionDiv.innerHTML = `
          <button class="btn-accept" id="acceptReviewBtn-${historyId}">✅ 同意建议并修改代码</button>
          <button class="btn-skip" id="skipReviewBtn-${historyId}">❌ 忽略并结束</button>
        `;
        targetDiv.appendChild(actionDiv);

        document.getElementById(`acceptReviewBtn-${historyId}`).addEventListener('click', () => {
          actionDiv.remove();
          loadingIndicator.style.display = 'flex';
          sendBtn.disabled = true;
          vscode.postMessage({type: 'approveReview', historyId, reviewText, implModel});
        });

        document.getElementById(`skipReviewBtn-${historyId}`).addEventListener('click', () => {
          actionDiv.remove();
          const badge = document.createElement('div');
          badge.className = 'task-done-badge';
          badge.textContent = '✅ 审查完成 (已忽略修改)';
          targetDiv.appendChild(badge);
          sendBtn.disabled = false;
        });

        const container = document.getElementById('chat-container');
        container.scrollTop = container.scrollHeight;
      }

      function renderSkillsList(skills) {
        skillsListContainer.innerHTML = '';
        activeSkillSelect.innerHTML = '<option value="">-- 不使用 Skill --</option>';

        if (!skills || skills.length === 0) {
          skillsListContainer.innerHTML =
            '<div style="font-size: 11px; color: var(--vscode-descriptionForeground);">暂无自定义 Skill</div>';
          return;
        }

        skills.forEach(skill => {
          const opt = document.createElement('option');
          opt.value = skill.content;
          opt.textContent = skill.name;
          activeSkillSelect.appendChild(opt);

          const item = document.createElement('div');
          item.className = 'skill-item';
          item.innerHTML = `<span>⚡ ${skill.name}</span><button class="btn-refresh" style="padding: 2px 4px; font-size: 10px;" data-name="${skill.name}">删除</button>`;
          item.querySelector('button').addEventListener('click', () => {
            vscode.postMessage({type: 'deleteSkill', name: skill.name});
          });
          skillsListContainer.appendChild(item);
        });
      }

      function renderHistoryList(history) {
        responseArea.innerHTML = '';
        if (selectAllCheckbox) selectAllCheckbox.checked = false;

        history.forEach(item => {
          const wrapper = document.createElement('div');
          wrapper.className = 'chat-item-wrapper';

          const headerRow = document.createElement('div');
          headerRow.className = 'chat-header-row';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'history-checkbox';
          checkbox.dataset.id = item.id;
          checkbox.addEventListener('change', () => {
            const all = document.querySelectorAll('.history-checkbox');
            const checked = document.querySelectorAll('.history-checkbox:checked');
            selectAllCheckbox.checked = all.length > 0 && all.length === checked.length;
          });

          const userMsg = document.createElement('div');
          userMsg.className = 'user-msg';
          userMsg.textContent = '用户: ' + item.prompt;

          headerRow.appendChild(checkbox);
          headerRow.appendChild(userMsg);
          wrapper.appendChild(headerRow);

          const details = document.createElement('details');
          details.className = 'response-box' + (item.completed ? ' completed' : '');
          if (!item.completed || item.reviewPending) details.open = true;

          const summary = document.createElement('summary');
          summary.className = 'response-summary';
          summary.textContent = '模型回复 (' + item.model + ')';
          details.appendChild(summary);

          const contentDiv = document.createElement('div');
          contentDiv.className =
            'response-content' +
            (!item.completed && !item.reviewPending ? ' active-streaming' : '');

          let html = item.response || '';
          html = html.split('<think>').join('<div class="thinking">思考中...<br>');
          html = html.split('</think>').join('</div><hr>');
          contentDiv.innerHTML = html;

          if (item.completed) {
            const badge = document.createElement('div');
            badge.className = 'task-done-badge';
            badge.textContent = '✅ 任务完成';
            contentDiv.appendChild(badge);
          } else if (item.reviewPending) {
            // 如果切走后切回，检测到处于 reviewPending 状态，自动重新挂载审查确认按钮
            setTimeout(() => {
              showReviewButtons(item.id, item.reviewText, item.model, contentDiv);
            }, 50);
          } else {
            // 未完成且非 reviewPending 的项赋予 active-streaming 用于接收流式数据
            contentDiv.classList.add('active-streaming');
          }

          details.appendChild(contentDiv);
          wrapper.appendChild(details);
          responseArea.appendChild(wrapper);
        });

        const container = document.getElementById('chat-container');
        container.scrollTop = container.scrollHeight;
      }
    </script>
  </body>
</html>
