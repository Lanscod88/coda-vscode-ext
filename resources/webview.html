<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: var(--vscode-font-family); padding: 10px; color: var(--vscode-editor-foreground); background: var(--vscode-editor-background); margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .panel-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: var(--vscode-foreground); border-bottom: 1px solid var(--vscode-panel-border); padding-bottom: 4px; }
        .control-group { margin-bottom: 8px; }
        select, textarea, button { width: 100%; box-sizing: border-box; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); padding: 6px; border-radius: 4px; font-family: inherit; }
        select:focus, textarea:focus { outline: 1px solid var(--vscode-focusBorder); }
        textarea { resize: vertical; height: 70px; margin-top: 5px; }
        button { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: var(--vscode-button-hoverBackground); }
        
        /* Loading 样式 */
        #loadingIndicator { display: none; align-items: center; gap: 8px; color: var(--vscode-descriptionForeground); font-size: 12px; margin: 8px 0; }
        .spinner { width: 12px; height: 12px; border: 2px solid var(--vscode-progressBar-background); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #chat-container { flex: 1; overflow-y: auto; border: 1px solid var(--vscode-panel-border); padding: 8px; margin-top: 5px; border-radius: 4px; background: var(--vscode-textCodeBlock-background); font-size: 13px; line-height: 1.4; }
        
        /* 用户提问样式（普通文本） */
        .user-msg { margin-bottom: 6px; white-space: pre-wrap; word-break: break-all; color: var(--vscode-textLink-activeForeground); font-weight: bold; }

        /* 可折叠的模型响应卡片样式 */
        .response-box { margin-bottom: 14px; border: 1px solid var(--vscode-panel-border); border-radius: 4px; background: var(--vscode-editor-background); overflow: hidden; }
        .response-summary { color: var(--vscode-editor-foreground); font-weight: bold; padding: 6px 8px; cursor: pointer; list-style: none; background: var(--vscode-sideBar-background); display: flex; align-items: center; gap: 6px; }
        .response-summary::-webkit-details-marker { display: none; }
        .response-summary::before { content: '▶'; font-size: 10px; transition: transform 0.2s; }
        details.response-box[open] > .response-summary::before { transform: rotate(90deg); }
        .response-content { padding: 8px; white-space: pre-wrap; word-break: break-all; border-top: 1px solid var(--vscode-panel-border); }

        .thinking { color: var(--vscode-descriptionForeground); border-left: 2px solid var(--vscode-textBlockQuote-border); padding-left: 6px; margin: 4px 0; font-style: italic; }
    </style>
</head>
<body>
    <div class="panel-title">本地AI对话</div>
    <div class="control-group">
        <label for="modelSelect" style="font-size: 12px; color: var(--vscode-descriptionForeground);">选择模型:</label>
        <select id="modelSelect">
            <option>正在获取模型列表...</option>
        </select>
    </div>
    <div class="control-group">
        <textarea id="promptInput" placeholder="输入你想编写的代码或问题... (Ctrl+Enter 发送)"></textarea>
        <button id="sendBtn">发送</button>
    </div>

    <!-- Loading 效果指示器 -->
    <div id="loadingIndicator">
        <div class="spinner"></div>
        <span>正在等待模型回应...</span>
    </div>

    <div id="chat-container">
        <div id="responseArea"></div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const modelSelect = document.getElementById('modelSelect');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const responseArea = document.getElementById('responseArea');
        const loadingIndicator = document.getElementById('loadingIndicator');

        window.addEventListener('load', () => {
            vscode.postMessage({ type: 'getModels' });
        });

        sendBtn.addEventListener('click', sendMessage);
        promptInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const prompt = promptInput.value.trim();
            const model = modelSelect.value;
            if (!prompt) return;

            // 1. 用户提问保持普通文本展示
            responseArea.innerHTML += '<div class="message user-msg">用户: ' + escapeHtml(prompt) + '</div>';
            
            // 2. 将模型的输出内容包裹在可折叠的 details 容器中
            responseArea.innerHTML += 
                '<details class="response-box" open>' +
                    '<summary class="response-summary">模型回复 (' + escapeHtml(model) + ')</summary>' +
                    '<div class="response-content" id="current-response"></div>' +
                '</details>';

            promptInput.value = '';
            loadingIndicator.style.display = 'flex';

            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;

            vscode.postMessage({ type: 'sendMessage', prompt, model });
        }

        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.type) {
                case 'modelList':
                    modelSelect.innerHTML = '';
                    if (!message.models || message.models.length === 0) {
                        modelSelect.innerHTML = '<option>未检测到本地模型</option>';
                        return;
                    }
                    message.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.textContent = m;
                        modelSelect.appendChild(opt);
                    });
                    break;
                case 'streamChunk':
                    loadingIndicator.style.display = 'none';

                    const curr = document.getElementById('current-response');
                    if (curr) {
                        curr.textContent += message.chunk;
                        
                        let html = curr.textContent;
                        html = html.split('<think>').join('<div class="thinking">思考中...<br>');
                        html = html.split('</think>').join('</div><hr>');
                        curr.innerHTML = html;

                        const container = document.getElementById('chat-container');
                        container.scrollTop = container.scrollHeight;
                    }
                    break;
                case 'streamEnd':
                    loadingIndicator.style.display = 'none';
                    const currEnd = document.getElementById('current-response');
                    if (currEnd) currEnd.removeAttribute('id');
                    break;
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
