<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: var(--vscode-font-family);
        padding: 10px;
        color: var(--vscode-editor-foreground);
        background: var(--vscode-editor-background);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
      }

      /* 视图容器 */
      .view-section {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      .view-section.active {
        display: flex;
      }

      /* 表单与控件样式 */
      .control-group {
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      label {
        display: block;
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
        margin-bottom: 3px;
      }
      select,
      input[type='text'],
      input[type='password'],
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        background: var(--vscode-input-background);
        color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border);
        padding: 6px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 12px;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: 1px solid var(--vscode-focusBorder);
      }
      textarea {
        resize: vertical;
        height: 70px;
        margin-top: 2px;
      }

      button.primary-btn {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-top: 5px;
      }
      button.primary-btn:hover:not(:disabled) {
        background: var(--vscode-button-hoverBackground);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }
      .btn-refresh {
        width: auto;
        padding: 6px 10px;
        white-space: nowrap;
        margin-top: 0;
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      .btn-refresh:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }

      /* Settings 标题与切换控制 */
      .settings-header {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 10px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--vscode-panel-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Loading 样式 */
      #loadingIndicator {
        display: none;
        align-items: center;
        gap: 8px;
        color: var(--vscode-descriptionForeground);
        font-size: 12px;
        margin: 8px 0;
      }
      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--vscode-progressBar-background);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #chat-container {
        flex: 1;
        overflow-y: auto;
        border: 1px solid var(--vscode-panel-border);
        padding: 8px;
        margin-top: 5px;
        border-radius: 4px;
        background: var(--vscode-textCodeBlock-background);
        font-size: 13px;
        line-height: 1.4;
      }

      .user-msg {
        margin-bottom: 6px;
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--vscode-textLink-activeForeground);
        font-weight: bold;
      }
      .response-box {
        margin-bottom: 14px;
        border: 1px solid var(--vscode-panel-border);
        border-radius: 4px;
        background: var(--vscode-editor-background);
        overflow: hidden;
      }
      .response-summary {
        color: var(--vscode-editor-foreground);
        font-weight: bold;
        padding: 6px 8px;
        cursor: pointer;
        list-style: none;
        background: var(--vscode-sideBar-background);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .response-summary::-webkit-details-marker {
        display: none;
      }
      .response-summary::before {
        content: '▶';
        font-size: 10px;
        transition: transform 0.2s;
      }
      details.response-box[open] > .response-summary::before {
        transform: rotate(90deg);
      }
      .response-content {
        padding: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        border-top: 1px solid var(--vscode-panel-border);
      }

      .thinking {
        color: var(--vscode-descriptionForeground);
        border-left: 2px solid var(--vscode-textBlockQuote-border);
        padding-left: 6px;
        margin: 4px 0;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <!-- 1. 聊天主界面 -->
    <div id="chatView" class="view-section active">
      <div class="control-group">
        <label for="modelSelect">选择模型:</label>
        <div class="row">
          <select id="modelSelect">
            <option>正在获取模型列表...</option>
          </select>
          <button id="refreshBtn" class="btn-refresh" title="刷新模型列表">🔄</button>
        </div>
      </div>
      <div class="control-group">
        <textarea
          id="promptInput"
          placeholder="输入你想编写的代码或问题... (Ctrl+Enter 发送)"
        ></textarea>
        <button id="sendBtn" class="primary-btn">发送</button>
      </div>

      <div id="loadingIndicator">
        <div class="spinner"></div>
        <span>正在等待模型回应...</span>
      </div>

      <div id="chat-container">
        <div id="responseArea"></div>
      </div>
    </div>

    <!-- 2. 设置界面 (Cline 风格) -->
    <div id="settingsView" class="view-section">
      <div class="settings-header">
        <span>API Configuration</span>
        <button id="closeSettingsBtn" class="btn-refresh" style="padding: 2px 6px">Done</button>
      </div>

      <div class="control-group">
        <label>API Provider (服务提供商)</label>
        <select id="providerSelect">
          <option value="ollama">Ollama (本地)</option>
          <option value="deepseek">DeepSeek</option>
          <option value="gemini">Google Gemini</option>
          <option value="openai">OpenAI / 兼容接口</option>
        </select>
      </div>

      <div class="control-group">
        <label>API Base URL (接口地址)</label>
        <input
          type="text"
          id="baseUrlInput"
          placeholder="例如: http://127.0.0.1:11434 或 https://api.deepseek.com"
        />
      </div>

      <div class="control-group">
        <label>API Key (密钥)</label>
        <input
          type="password"
          id="apiKeyInput"
          placeholder="请输入 API Key (Ollama 本地服务可留空)"
        />
      </div>

      <button id="saveSettingsBtn" class="primary-btn">保存配置</button>
    </div>

    <script>
      const vscode = acquireVsCodeApi();

      const chatView = document.getElementById('chatView');
      const settingsView = document.getElementById('settingsView');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');

      const providerSelect = document.getElementById('providerSelect');
      const baseUrlInput = document.getElementById('baseUrlInput');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');

      const modelSelect = document.getElementById('modelSelect');
      const refreshBtn = document.getElementById('refreshBtn');
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const responseArea = document.getElementById('responseArea');
      const loadingIndicator = document.getElementById('loadingIndicator');

      let isSettingsOpen = false;

      function toggleSettings(open) {
        isSettingsOpen = typeof open === 'boolean' ? open : !isSettingsOpen;
        if (isSettingsOpen) {
          chatView.classList.remove('active');
          settingsView.classList.add('active');
          vscode.postMessage({type: 'getSettings'});
        } else {
          settingsView.classList.remove('active');
          chatView.classList.add('active');
          vscode.postMessage({type: 'getModels'});
        }
      }

      closeSettingsBtn.addEventListener('click', () => toggleSettings(false));

      providerSelect.addEventListener('change', () => {
        const p = providerSelect.value;
        if (p === 'ollama') baseUrlInput.value = 'http://127.0.0.1:11434';
        if (p === 'deepseek') baseUrlInput.value = 'https://api.deepseek.com';
        if (p === 'openai') baseUrlInput.value = 'https://api.openai.com/v1';
      });

      window.addEventListener('load', () => {
        vscode.postMessage({type: 'getSettings'});
        vscode.postMessage({type: 'getModels'});
      });

      refreshBtn.addEventListener('click', () => {
        modelSelect.innerHTML = '<option>正在获取模型列表...</option>';
        vscode.postMessage({type: 'getModels'});
      });

      saveSettingsBtn.addEventListener('click', () => {
        const settings = {
          provider: providerSelect.value,
          baseUrl: baseUrlInput.value.trim(),
          apiKey: apiKeyInput.value.trim(),
        };
        vscode.postMessage({type: 'saveSettings', settings});
      });

      sendBtn.addEventListener('click', sendMessage);
      promptInput.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') {
          if (!sendBtn.disabled) sendMessage();
        }
      });

      function sendMessage() {
        const prompt = promptInput.value.trim();
        const model = modelSelect.value;
        if (!prompt || !model) return;

        sendBtn.disabled = true;
        responseArea.innerHTML +=
          '<div class="message user-msg">用户: ' + escapeHtml(prompt) + '</div>';
        responseArea.innerHTML +=
          '<details class="response-box" open>' +
          '<summary class="response-summary">模型回复 (' +
          escapeHtml(model) +
          ')</summary>' +
          '<div class="response-content" id="current-response"></div>' +
          '</details>';

        promptInput.value = '';
        loadingIndicator.style.display = 'flex';

        const container = document.getElementById('chat-container');
        container.scrollTop = container.scrollHeight;

        vscode.postMessage({type: 'sendMessage', prompt, model});
      }

      window.addEventListener('message', event => {
        const message = event.data;
        switch (message.type) {
          case 'toggleSettingsView':
            toggleSettings();
            break;
          case 'loadSettings':
            const s = message.settings;
            providerSelect.value = s.provider || 'ollama';
            baseUrlInput.value = s.baseUrl || '';
            apiKeyInput.value = s.apiKey || '';
            break;
          case 'settingsSaved':
            toggleSettings(false);
            break;
          case 'modelList':
            modelSelect.innerHTML = '';
            if (!message.models || message.models.length === 0) {
              modelSelect.innerHTML = '<option>未检测到可用模型</option>';
              return;
            }
            message.models.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m;
              opt.textContent = m;
              if (message.selectedModel && m === message.selectedModel) {
                opt.selected = true;
              }
              modelSelect.appendChild(opt);
            });
            break;
          case 'streamChunk':
            loadingIndicator.style.display = 'none';
            const curr = document.getElementById('current-response');
            if (curr) {
              curr.textContent += message.chunk;
              let html = curr.textContent;
              html = html.split('<think>').join('<div class="thinking">思考中...<br>');
              html = html.split('</think>').join('</div><hr>');
              curr.innerHTML = html;

              const container = document.getElementById('chat-container');
              container.scrollTop = container.scrollHeight;
            }
            break;
          case 'streamEnd':
            loadingIndicator.style.display = 'none';
            sendBtn.disabled = false;
            const currEnd = document.getElementById('current-response');
            if (currEnd) currEnd.removeAttribute('id');
            break;
        }
      });

      function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    </script>
  </body>
</html>
